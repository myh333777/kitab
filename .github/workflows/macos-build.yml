name: macOS Build

on:
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Source checks
        run: python3 tools/check_source.py
      - name: Patched gpui
        run: python3 tools/patch_gpui.py
      - uses: swatinem/rust-cache@v2
        with:
          key: macos-release
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: python3 tools/build_release.py
      - name: Package DMG
        run: |
          python3 tools/package.py 0.6.2
          shasum -a 256 dist/Kitab_0.6.2_aarch64.dmg | tee dist/Kitab_0.6.2_aarch64.dmg.sha256
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitab-macos-aarch64
          path: |
            dist/Kitab_0.6.2_aarch64.dmg
            dist/Kitab_0.6.2_aarch64.dmg.sha256
